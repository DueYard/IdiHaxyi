<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Иди нахуй (но сначала напугаем)</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: black;
            overflow: hidden;
            font-family: Arial, sans-serif;
            cursor: pointer;
        }
        #text {
            font-size: 2rem;
            font-weight: bold;
            text-transform: uppercase;
            animation: pulse 2s infinite, colorChange 5s infinite;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.7);
            margin-bottom: 10px;
            transition: all 0.3s;
        }
        #heart {
            font-size: 3rem;
            animation: pulse 1.5s infinite, colorChange 3s infinite;
        }
        #scare {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            z-index: 1000;
            transition: opacity 0.1s;
        }
        #scare img {
            max-width: 100%;
            max-height: 100%;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        @keyframes colorChange {
            0% { color: red; }
            20% { color: #ff69b4; }
            40% { color: #ff1493; }
            60% { color: #ff00ff; }
            80% { color: #9400d3; }
            100% { color: red; }
        }
    </style>
</head>
<body onclick="scareTheShitOutOfYou()">
    <div id="text">ИДИ НАХУЙ</div>
    <div id="heart">❤️</div>

    <!-- Скрытый скример -->
    <div id="scare">
        <img src="https://imgur.com/gallery/sosi-BC7J98y" alt="SCREAM"> <!-- Замени ссылку на свою картинку -->
    </div>

    <script>
        function scareTheShitOutOfYou() {
            const scareDiv = document.getElementById('scare');
            scareDiv.style.opacity = '1';
            
            // Громкий звук (опционально)
            const audio = new Audio('https://www.myinstants.com/media/sounds/jumpscare-sound.mp3'); // Замени ссылку на звук
            audio.volume = 1.0;
            audio.play();
            
            // Через 2 секунды скрываем скример
            setTimeout(() => {
                scareDiv.style.opacity = '0';
            }, 2000);
        }
    </script>
</body>
</html>
